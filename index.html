    <style>
      /* Shown until React mounts, so a cold start is never a white or empty screen. */
      html,
      body {
        margin: 0;
        background: #0b0c10;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .boot img {
        width: 72px;
        height: 72px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><img src="./favicon.svg" alt="WatchMatch" /></div>
    </div>
    <noscript>O WatchMatch precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
